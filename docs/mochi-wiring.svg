<text x="868" y="835" fill="#d33b40" font-size="21" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">VDD</text>
<polyline points="690,890 850,890" fill="none" stroke="#39465a" stroke-width="4" stroke-linejoin="round"/>
