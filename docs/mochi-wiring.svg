<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1300" viewBox="0 0 1280 1300">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="54" y="32" fill="#17233b" font-size="35" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">МОЧИ · СХЕМА ПОДКЛЮЧЕНИЯ</text>
<text x="54" y="85" fill="#17233b" font-size="22" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ESP32-C3 Super Mini + OLED SSD1306 + сенсорная кнопка + INMP441</text>
<rect x="54" y="132" width="1172" height="54" rx="10" fill="#fff3db" stroke="#e7c883" stroke-width="2"/>
<text x="74" y="143" fill="#17233b" font-size="22" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Подключать при отключённом USB. Питание модулей: только 3,3 В.</text>
