<text x="868" y="875" fill="#39465a" font-size="21" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">GND</text>
<polyline points="690,930 850,930" fill="none" stroke="#39465a" stroke-width="4" stroke-linejoin="round"/>
<circle cx="690" cy="930" r="6" fill="#39465a"/>
<circle cx="850" cy="930" r="6" fill="#39465a"/>
<text x="868" y="915" fill="#39465a" font-size="21" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">L/R</text>
<text x="80" y="535" fill="#17233b" font-size="20" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Подписаны номера GPIO.</text>
<text x="80" y="565" fill="#17233b" font-size="20" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Ориентируйтесь на надписи</text>
<text x="80" y="595" fill="#17233b" font-size="20" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">на своей плате.</text>
<text x="80" y="765" fill="#17233b" font-size="24" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">USB → ноутбук</text>
<text x="80" y="807" fill="#17233b" font-size="19" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Питание и прошивка</text>
<text x="80" y="837" fill="#17233b" font-size="19" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Голос звучит через</text>
<text x="80" y="867" fill="#17233b" font-size="19" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">колонки ноутбука.</text>
<text x="54" y="1132" fill="#17233b" font-size="24" font-family="Segoe UI, sans-serif" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">Важно</text>
<text x="54" y="1170" fill="#17233b" font-size="20" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">• SCK дисплея → GPIO21. SCK микрофона → GPIO6. Не соединять их вместе.</text>
<text x="54" y="1202" fill="#17233b" font-size="20" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">• VDD микрофона — не 5 В. L/R соединить с общей землёй GND.</text>
<text x="54" y="1234" fill="#17233b" font-size="19" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">• Если на INMP441 нет резистора SD–GND 100 кОм, добавьте его отдельно.</text>
<text x="54" y="1265" fill="#5c6980" font-size="16" font-family="Segoe UI, sans-serif" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Схематическое расположение контактов. Соединены только линии с точками в месте пересечения.</text>
</svg>